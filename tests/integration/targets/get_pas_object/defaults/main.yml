# Inherit setup_cyberark role outputs into properly prefixed get_pas_object
# variables. Tasks in this role reference only the get_pas_object_* variables.
get_pas_object_url: "{{ setup_cyberark_url }}"
get_pas_object_app_id: "{{ setup_cyberark_app_id }}"
get_pas_object_client_cert: "{{ setup_cyberark_client_cert }}"
get_pas_object_client_key: "{{ setup_cyberark_client_key }}"
get_pas_object_query: "Safe=MySafe;Object=MyAccount"

# Whether the CyberArk CCP service was reachable (set by the setup_cyberark
# role). Live, service-dependent tests are gated on this.
get_pas_object_service_available: "{{ setup_cyberark_service_available }}"
