# Live (service-dependent) tests: validate the data the CyberArk CCP service
# actually returns. These require a reachable service, so the whole block is
# skipped when setup_cyberark reports the service as unavailable. In that case
# setup_cyberark has already emitted a warning (or failed the run, if
# setup_cyberark_require_service is enabled).
#
# NOTE: CI does not have access to a real CyberArk CCP tenant with a known
# safe/object to query, so these assertions are intentionally structural
# rather than value-based: they confirm the module and lookup plugin actually
# round-trip a request to the configured CCP endpoint (rather than crashing
# locally on something like a bad argument spec or a Python exception), and
# that a failure -- expected, since get_pas_object_query does not name a real
# object -- surfaces as a clean CyberarkCCPError message rather than a
# traceback. A deployment with real credentials and a known test object should
# tighten `get_pas_object_module_result.value`/`get_pas_object_lookup_result`
# to assert the actual expected secret value/shape.

- name: Expected-return-values | Live CyberArk CCP checks
  when: get_pas_object_service_available | bool
  block:
    - name: Expected-return-values | Fetch a credential via the module
      silexdata.cyberark.get_pas_object:
        url: "{{ get_pas_object_url }}"
        app_id: "{{ get_pas_object_app_id }}"
        object_query: "{{ get_pas_object_query }}"
        client_cert: "{{ get_pas_object_client_cert }}"
        client_key: "{{ get_pas_object_client_key }}"
      register: get_pas_object_module_result
      ignore_errors: true

    - name: Expected-return-values | Assert the module round-tripped a request to CCP
      ansible.builtin.assert:
        that:
          - get_pas_object_module_result is not changed
          - >-
            (get_pas_object_module_result is succeeded and
             get_pas_object_module_result.value is defined) or
            (get_pas_object_module_result is failed and
             'CyberArk' in get_pas_object_module_result.msg)
        fail_msg: "Unexpected response from the get_pas_object module: {{ get_pas_object_module_result }}"
        success_msg: "get_pas_object module returned the expected response shape."

    - name: Expected-return-values | Fetch a credential via the lookup plugin
      ansible.builtin.set_fact:
        get_pas_object_lookup_result: >-
          {{ lookup('silexdata.cyberark.get_pas_object', get_pas_object_query,
             url=get_pas_object_url,
             app_id=get_pas_object_app_id,
             client_cert=get_pas_object_client_cert,
             client_key=get_pas_object_client_key) }}
      register: get_pas_object_lookup_task
      ignore_errors: true

    - name: Expected-return-values | Assert the lookup plugin round-tripped a request to CCP
      ansible.builtin.assert:
        that:
          - >-
            (get_pas_object_lookup_task is succeeded and
             get_pas_object_lookup_result is defined) or
            (get_pas_object_lookup_task is failed and
             'CyberArk' in get_pas_object_lookup_task.msg)
        fail_msg: "Unexpected response from the get_pas_object lookup: {{ get_pas_object_lookup_task }}"
        success_msg: "get_pas_object lookup returned the expected response shape."
