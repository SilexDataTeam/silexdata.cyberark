# Setup role for the silexdata.cyberark integration tests.
#
# Responsibilities:
#   1. Initialize the shared setup_cyberark_* variables.
#   2. Probe the CyberArk CCP endpoint for availability and record
#      setup_cyberark_service_available so service-dependent ("live") tests
#      can be skipped when the service is down.
#
# When the service is unreachable the default behavior is to warn and let live
# tests skip. Set setup_cyberark_require_service=true to fail the run instead.

- name: Extract the hostname from setup_cyberark_url
  ansible.builtin.set_fact:
    setup_cyberark_host: "{{ setup_cyberark_url | urlsplit('hostname') }}"

- name: Probe the CyberArk CCP endpoint for availability
  ansible.builtin.wait_for:
    host: "{{ setup_cyberark_host }}"
    port: 443
    timeout: "{{ setup_cyberark_service_probe_timeout }}"
    state: started
  register: setup_cyberark_probe
  ignore_errors: true

- name: Record whether the CyberArk CCP service is available
  ansible.builtin.set_fact:
    setup_cyberark_service_available: "{{ setup_cyberark_probe is succeeded }}"

- name: Fail because the CyberArk CCP service is unavailable and is required
  ansible.builtin.fail:
    msg: >-
      CyberArk CCP service {{ setup_cyberark_host }}:443 is not reachable and
      setup_cyberark_require_service is enabled.
  when:
    - not (setup_cyberark_service_available | bool)
    - setup_cyberark_require_service | bool

- name: Warn that live tests will be skipped because the service is unavailable
  ansible.builtin.debug:
    # Prints a stable marker token (SETUP_SERVICE_UNAVAILABLE) so CI can detect
    # this condition in the run output and raise a native warning annotation.
    # Locally this just surfaces as a readable warning message.
    msg: >-
      SETUP_SERVICE_UNAVAILABLE: CyberArk CCP service
      {{ setup_cyberark_host }}:443 is not reachable; skipping live
      integration tests. Set setup_cyberark_require_service=true to fail instead.
  when:
    - not (setup_cyberark_service_available | bool)
    - not (setup_cyberark_require_service | bool)
