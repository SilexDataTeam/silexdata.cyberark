# Setup role for the silexdata.cyberark integration tests.
#
# Responsibilities:
#   1. Initialize the shared setup_cyberark_* variables.
#   2. Probe the target service for availability and record
#      setup_cyberark_service_available so service-dependent
#      ("live") tests can be skipped when the service is down.
#
# When the service is unreachable the default behavior is to warn and let
# live tests skip. Set setup_cyberark_require_service=true to
# fail the run instead.

# TODO: this skeleton has no way to know the real auth shape for whatever
# service this collection targets. If your modules take a single grouped auth
# dict (like silexdata.akamai's edge_auth), build it here from the
# setup_cyberark_* variables you added to defaults/main.yml, e.g.:
#
# - name: Initialize the shared auth variable
#   ansible.builtin.set_fact:
#     setup_cyberark_auth:
#       endpoint: "{{ setup_cyberark_endpoint }}"
#       username: "{{ setup_cyberark_username }}"
#       password: "{{ setup_cyberark_password }}"
#
# If your modules instead take flat url/credential parameters directly, skip
# this step; the manage_<module> targets can reference the
# setup_cyberark_* variables directly via their own remapped
# defaults.

# TODO: replace host/port with the real endpoint variable(s) you defined
# above (e.g. a hostname parsed out of setup_cyberark_endpoint
# via the urlsplit filter, and the real port your service listens on).
- name: Probe the cyberark service endpoint for availability
  ansible.builtin.wait_for:
    host: "dry-run.cyberark.invalid" # TODO: replace with the real host
    port: 443 # TODO: replace with the real port
    timeout: "{{ setup_cyberark_service_probe_timeout }}"
    state: started
  register: setup_cyberark_probe
  ignore_errors: true

- name: Record whether the cyberark service is available
  ansible.builtin.set_fact:
    setup_cyberark_service_available: "{{ setup_cyberark_probe is succeeded }}"

- name: Fail because the cyberark service is unavailable and is required
  ansible.builtin.fail:
    msg: >-
      The cyberark service is not reachable and
      setup_cyberark_require_service is enabled.
  when:
    - not (setup_cyberark_service_available | bool)
    - setup_cyberark_require_service | bool

- name: Warn that live tests will be skipped because the service is unavailable
  ansible.builtin.debug:
    # Prints a stable marker token (SETUP_SERVICE_UNAVAILABLE) so CI can detect
    # this condition in the run output and raise a native warning annotation.
    # Locally this just surfaces as a readable warning message.
    msg: >-
      SETUP_SERVICE_UNAVAILABLE: the cyberark service is not
      reachable; skipping live integration tests. Set
      setup_cyberark_require_service=true to fail instead.
  when:
    - not (setup_cyberark_service_available | bool)
    - not (setup_cyberark_require_service | bool)
