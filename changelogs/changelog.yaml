---
ancestor: null
releases:
  1.0.0:
    changes:
      major_changes:
        - Initial release. The ``get_pas_object`` lookup plugin, and a module of the
          same name, retrieve account properties such as the password from CyberArk
          CCP's AIM Web Service, with optional client-certificate authentication.
          Both run on the controller, so only the controller needs the ``requests``
          library and network access to CCP.
      release_summary: Initial release of the ``silexdata.cyberark`` collection, for
        retrieving credentials from CyberArk's Central Credential Provider (CCP).
    fragments:
      - import-cyberark-ccp.yml
    modules:
      - description: Retrieve a credential from CyberArk Central Credential Provider
          (CCP).
        name: get_pas_object
        namespace: ''
    plugins:
      lookup:
        - description: Retrieve a credential from CyberArk Central Credential Provider
            (CCP).
          name: get_pas_object
          namespace: null
    release_date: '2026-09-23'
  1.1.0:
    changes:
      minor_changes:
        - get_pas_object - add the ``client_cert_file`` and ``client_key_file`` options,
          to give the client certificate and key as paths to PEM files on the controller
          instead of as PEM content.
        - get_pas_object - the module and lookup plugin read each connection option
          they are not given (``url``, ``app_id``, ``webservice_id``, ``verify`` and
          the client certificate and key) from a ``cyberark_ccp_*`` Ansible variable,
          then a ``CYBERARK_CCP_*`` environment variable on the controller.
    fragments:
      - ccp-env-var-fallbacks.yml
      - readme-badges-and-docs.yml
      - sync-claude-rules.yml
      - sync-skeleton.yml
    release_date: '2026-10-15'
